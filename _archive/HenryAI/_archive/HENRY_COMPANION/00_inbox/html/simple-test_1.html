<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Simple Button Test</title>
<style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #e6e6e6; }
        button { padding: 10px 20px; margin: 10px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .result { margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 5px; }
    </style>

</head>
<body>
<h1>Simple Button Test</h1>
<button onclick="simpleTest()">Click Me - Simple Test</button>
<div class="result" id="result">Click the button to test</div>
<button onclick="wizardTest()">Test Wizard Button</button>
<div class="result" id="wizard-result">Wizard test result</div>
<script>
        console.log('=== SIMPLE TEST PAGE LOADED ===');
        
        function simpleTest() {
            try {
                const result = document.getElementById('result');
                result.textContent = '✅ Button clicked successfully! JavaScript is working.';
                result.style.color = '#059669';
                console.log('Simple test passed');
            } catch (error) {
                const result = document.getElementById('result');
                result.textContent = '❌ Error: ' + error.message;
                result.style.color = '#dc2626';
                console.error('Simple test failed:', error);
            }
        }
        
        function wizardTest() {
            try {
                const result = document.getElementById('wizard-result');
                
                // Test if nextWizardStep exists
                if (typeof window.nextWizardStep === 'function') {
                    window.nextWizardStep(2);
                    result.textContent = '✅ nextWizardStep(2) executed successfully!';
                    result.style.color = '#059669';
                } else {
                    result.textContent = '❌ nextWizardStep function not found';
                    result.style.color = '#dc2626';
                }
            } catch (error) {
                const result = document.getElementById('wizard-result');
                result.textContent = '❌ Wizard test error: ' + error.message;
                result.style.color = '#dc2626';
            }
        }
        
        // Auto-test on load
        setTimeout(() => {
            console.log('Auto-testing basic functionality...');
            simpleTest();
        }, 500);
    </script>
<script src="henry-core.js"></script></body>
</html>
