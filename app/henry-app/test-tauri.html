<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tauri Test</title>
    <script src="https://unpkg.com/@tauri-apps/api@1.5.0/dist/index.js"></script>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
    <h1>Tauri Functionality Test</h1>
    <button id="test-platform">Get Platform</button>
    <button id="test-password">Generate Password</button>
    <button id="test-security">Security Audit</button>
    <div id="output"></div>

    <script>
        document.getElementById('test-platform').addEventListener('click', async () => {
            try {
                const platform = await window.__TAURI__.tauri.invoke('get_platform');
                document.getElementById('output').innerHTML = `<p>Platform: ${platform}</p>`;
            } catch (error) {
                document.getElementById('output').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });

        document.getElementById('test-password').addEventListener('click', async () => {
            try {
                const password = await window.__TAURI__.tauri.invoke('generate_secure_password');
                document.getElementById('output').innerHTML = `<p>Generated Password: ${password}</p>`;
            } catch (error) {
                document.getElementById('output').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });

        document.getElementById('test-security').addEventListener('click', async () => {
            try {
                const audit = await window.__TAURI__.tauri.invoke('perform_security_audit');
                document.getElementById('output').innerHTML = `
                    <p>Security Audit Results:</p>
                    <p>Vulnerabilities: ${audit.vulnerabilities}</p>
                    <p>Score: ${audit.score}/100</p>
                    <p>Recommendations: ${audit.recommendations.join(', ')}</p>
                `;
            } catch (error) {
                document.getElementById('output').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
