<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wizard Test</title>
<style>
        .wizard-step {
            display: none;
        }
        .wizard-step.active {
            display: block;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
    </style>

</head>
<body>
<div class="setup-wizard-overlay" id="setup-wizard">
<div class="wizard-container">
<div class="wizard-content">
<!-- Step 1: Introduction -->
<div class="wizard-step active" id="step-1">
<h2>Step 1</h2>
<p>This is the first step</p>
<div class="wizard-actions">
<button class="wizard-btn primary" onclick="nextWizardStep(2)">Let's Get Started</button>
</div>
</div>
<!-- Step 2: Business Focus -->
<div class="wizard-step" id="step-2">
<h2>Step 2</h2>
<p>This is the second step</p>
</div>
</div>
</div>
</div>
<script>
        function nextWizardStep(step) {
            const currentStep = document.querySelector('.wizard-step.active');
            const nextStep = document.getElementById(`step-${step}`);
            
            if (currentStep && nextStep) {
                currentStep.classList.remove('active');
                nextStep.classList.add('active');
                console.log(`Navigated to step ${step}`);
            } else {
                console.error(`Could not navigate to step ${step}`);
            }
        }
    </script>
<script src="henry-core.js"></script></body>
</html>
