<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Henry AI - Minimal Test</title>
<style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #e6e6e6; }
        .wizard-container { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 2rem; max-width: 600px; margin: 0 auto; }
        button { padding: 12px 24px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .result { margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 5px; }
        .success { color: #059669; }
        .error { color: #dc2626; }
    </style>

</head>
<body>
<div class="wizard-container">
<h1>🧙‍♂️ Henry AI - Minimal Test</h1>
<p>Testing basic button functionality</p>
<div class="wizard-step active" id="step-1">
<h2>Step 1: Test Button</h2>
<p>Click the button below to test basic functionality</p>
<div class="wizard-actions">
<button class="wizard-btn primary" onclick="testButton()">Let's Get Started</button>
</div>
</div>
<div class="wizard-step" id="step-2">
<h2>Step 2: Result</h2>
<p class="result" id="test-result">Waiting for test...</p>
<div class="wizard-actions">
<button class="wizard-btn secondary" onclick="goBack()">Back</button>
</div>
</div>
<div class="result" id="debug-info"></div>
</div>
<script>
        console.log('=== MINIMAL TEST LOADED ===');
        
        // Minimal HenryAI mock for testing
        class MinimalHenryAI {
            constructor() {
                console.log('MinimalHenryAI created');
                this.businessFocus = 'test';
            }
            
            showNotification(message, type) {
                console.log('Notification:', message, type);
            }
            
            speak(message) {
                console.log('Speak:', message);
            }
            
            updateStatus(status, message) {
                console.log('Status:', status, message);
            }
        }
        
        // Create HenryAI instance
        window.henryAI = new MinimalHenryAI();
        console.log('window.henryAI created:', window.henryAI);
        
        function testButton() {
            console.log('=== TEST BUTTON CLICKED ===');
            try {
                const result = document.getElementById('test-result');
                const debugInfo = document.getElementById('debug-info');
                
                result.textContent = '✅ Button clicked successfully!';
                result.className = 'result success';
                result.style.color = '#059669';
                
                debugInfo.innerHTML = `
                    <strong>Test Results:</strong><br>
                    ✅ Button click detected<br>
                    ✅ DOM manipulation working<br>
                    ✅ JavaScript execution successful<br>
                    ✅ HenryAI instance: ${typeof window.henryAI}
                `;
                
                // Move to next step
                nextWizardStep(2);
                
                console.log('Test completed successfully');
                
            } catch (error) {
                console.error('Test failed:', error);
                const result = document.getElementById('test-result');
                result.textContent = '❌ Test failed: ' + error.message;
                result.className = 'result error';
                result.style.color = '#dc2626';
            }
        }
        
        function nextWizardStep(step) {
            console.log('nextWizardStep called with step:', step);
            try {
                const currentStep = document.querySelector('.wizard-step.active');
                const nextStep = document.getElementById(`step-${step}`);
                
                console.log('Current step:', currentStep);
                console.log('Next step:', nextStep);
                
                if (currentStep && nextStep) {
                    currentStep.classList.remove('active');
                    nextStep.classList.add('active');
                    console.log('Successfully moved to step:', step);
                } else {
                    console.error('Could not find step elements');
                }
            } catch (error) {
                console.error('nextWizardStep error:', error);
            }
        }
        
        function goBack() {
            console.log('Going back to step 1');
            nextWizardStep(1);
        }
        
        // Auto-test on load
        setTimeout(() => {
            console.log('Auto-running basic tests...');
            console.log('DOM ready state:', document.readyState);
            console.log('Body exists:', !!document.body);
            console.log('Test button exists:', !!document.querySelector('button'));
        }, 100);
    </script>
<script src="henry-core.js"></script></body>
</html>
