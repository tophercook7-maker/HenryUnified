<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Henry AI - Diagnostic Test</title>
<style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #e6e6e6; }
        .test-section { margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 8px; }
        button { padding: 10px 15px; margin: 5px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .result { margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 5px; font-family: monospace; }
        .success { color: #059669; }
        .error { color: #dc2626; }
    </style>

</head>
<body>
<h1>🧪 Henry AI - Diagnostic Test</h1>
<div class="test-section">
<h3>Basic JavaScript Test</h3>
<button onclick="testBasicJS()">Test JavaScript</button>
<div class="result" id="js-result"></div>
</div>
<div class="test-section">
<h3>DOM Access Test</h3>
<button onclick="testDOMAccess()">Test DOM Access</button>
<div class="result" id="dom-result"></div>
</div>
<div class="test-section">
<h3>Button Click Test</h3>
<button id="test-btn" onclick="testButtonClick()">Click Me</button>
<div class="result" id="button-result"></div>
</div>
<div class="test-section">
<h3>HenryAI Test</h3>
<button onclick="testHenryAI()">Test HenryAI</button>
<div class="result" id="henry-result"></div>
</div>
<div class="test-section">
<h3>Wizard Button Test</h3>
<button onclick="testWizardButton()">Test Wizard Button</button>
<div class="result" id="wizard-result"></div>
</div>
<script>
        console.log('=== DIAGNOSTIC PAGE LOADED ===');
        
        function testBasicJS() {
            try {
                const result = document.getElementById('js-result');
                result.textContent = '✅ JavaScript is working! Math test: 2+2=' + (2+2);
                result.className = 'result success';
            } catch (error) {
                const result = document.getElementById('js-result');
                result.textContent = '❌ JavaScript error: ' + error.message;
                result.className = 'result error';
            }
        }
        
        function testDOMAccess() {
            try {
                const buttons = document.querySelectorAll('button');
                const result = document.getElementById('dom-result');
                result.textContent = `✅ DOM access working! Found ${buttons.length} buttons`;
                result.className = 'result success';
            } catch (error) {
                const result = document.getElementById('dom-result');
                result.textContent = '❌ DOM access error: ' + error.message;
                result.className = 'result error';
            }
        }
        
        function testButtonClick() {
            try {
                const result = document.getElementById('button-result');
                result.textContent = '✅ Button clicked successfully! Time: ' + new Date().toLocaleTimeString();
                result.className = 'result success';
                console.log('Button click test passed');
            } catch (error) {
                const result = document.getElementById('button-result');
                result.textContent = '❌ Button click error: ' + error.message;
                result.className = 'result error';
            }
        }
        
        function testHenryAI() {
            try {
                const result = document.getElementById('henry-result');
                if (typeof window.henryAI !== 'undefined') {
                    result.textContent = '✅ HenryAI found! Type: ' + typeof window.henryAI;
                    result.className = 'result success';
                } else {
                    result.textContent = '❌ HenryAI not found. window.henryAI is undefined';
                    result.className = 'result error';
                }
            } catch (error) {
                const result = document.getElementById('henry-result');
                result.textContent = '❌ HenryAI test error: ' + error.message;
                result.className = 'result error';
            }
        }
        
        function testWizardButton() {
            try {
                // Test the actual wizard button functionality
                if (typeof window.henryAI !== 'undefined' && typeof window.henryAI.showMainInterface === 'function') {
                    const result = document.getElementById('wizard-result');
                    result.textContent = '✅ Wizard functions available! Testing nextWizardStep...';
                    result.className = 'result success';
                    
                    // Actually test the wizard function
                    if (typeof window.nextWizardStep === 'function') {
                        window.nextWizardStep(2);
                        result.textContent += '\n✅ nextWizardStep(2) executed successfully!';
                    } else {
                        result.textContent += '\n❌ nextWizardStep function not found';
                    }
                } else {
                    const result = document.getElementById('wizard-result');
                    result.textContent = '❌ HenryAI wizard functions not available';
                    result.className = 'result error';
                }
            } catch (error) {
                const result = document.getElementById('wizard-result');
                result.textContent = '❌ Wizard button test error: ' + error.message;
                result.className = 'result error';
            }
        }
        
        // Auto-run basic tests
        setTimeout(() => {
            testBasicJS();
            testDOMAccess();
            testHenryAI();
        }, 1000);
    </script>
<script src="henry-core.js"></script></body>
</html>
