<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Button Functionality Test</title>
<style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 10px; background: white; border-radius: 5px; }
    </style>
</head>
<body>
<h1>Button Functionality Test</h1>
<button onclick="handleClick()">Click Me</button>
<div id="result">Click the button to test functionality</div>
<script>
        console.log('Button test page loaded');
        
        function handleClick() {
            console.log('Button clicked!');
            try {
                const result = document.getElementById('result');
                result.textContent = '✅ Button clicked successfully! Time: ' + new Date().toLocaleTimeString();
                result.style.backgroundColor = '#d4edda';
                result.style.color = '#155724';
                console.log('Button functionality working correctly');
            } catch (error) {
                console.error('Button click failed:', error);
                const result = document.getElementById('result');
                result.textContent = '❌ Error: ' + error.message;
                result.style.backgroundColor = '#f8d7da';
                result.style.color = '#721c24';
            }
        }
        
        // Test on load
        setTimeout(() => {
            console.log('Auto-testing button functionality...');
            console.log('Document ready:', document.readyState);
            console.log('Button exists:', !!document.querySelector('button'));
        }, 100);
    </script>
<script src="henry-core.js"></script></body>
</html>
