<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Henry AI - Diagnostic Tool</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff00;
            font-size: 24px;
        }

        .test-section {
            background: #2a2a2a;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .test-button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        .test-button:hover {
            background: #00cc00;
        }

        .console-output {
            background: #000;
            color: #00ff00;
            padding: 10px;
            border-radius: 3px;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .status {
            padding: 5px 10px;
            border-radius: 3px;
            margin: 5px 0;
        }

        .status-pass {
            background: #003300;
            color: #00ff00;
            border: 1px solid #00ff00;
        }

        .status-fail {
            background: #330000;
            color: #ff0000;
            border: 1px solid #ff0000;
        }

        .status-info {
            background: #003333;
            color: #00ffff;
            border: 1px solid #00ffff;
        }
    </style>

</head>
<body>
<div class="header">
        🔧 HENRY AI DIAGNOSTIC TOOL 🔧
    </div>
<div class="test-section">
<h3>🔍 Browser Compatibility Test</h3>
<button class="test-button" onclick="testBrowserFeatures()">Test Browser Features</button>
<div class="console-output" id="browser-results"></div>
</div>
<div class="test-section">
<h3>🎯 Event Listener Test</h3>
<button class="test-button" onclick="testEventListeners()">Test Event Listeners</button>
<div class="console-output" id="event-results"></div>
</div>
<div class="test-section">
<h3>🎤 Voice Recognition Test</h3>
<button class="test-button" onclick="testVoiceRecognition()">Test Voice Recognition</button>
<button class="test-button" onclick="stopVoiceTest()">Stop Voice Test</button>
<div class="console-output" id="voice-results"></div>
</div>
<div class="test-section">
<h3>⌨️ Keyboard Event Test</h3>
<input id="test-input" placeholder="Type here and press Enter..." style="width: 100%; padding: 10px; margin: 10px 0;" type="text"/>
<div class="console-output" id="keyboard-results"></div>
</div>
<div class="test-section">
<h3>🧪 Button Click Test</h3>
<button class="test-button" id="test-button-1">Test Button 1</button>
<button class="test-button" id="test-button-2">Test Button 2</button>
<button class="test-button" id="test-button-3">Test Button 3</button>
<div class="console-output" id="button-results"></div>
</div>
<div class="test-section">
<h3>🔧 JavaScript Error Test</h3>
<button class="test-button" onclick="testJavaScriptErrors()">Test Error Handling</button>
<div class="console-output" id="error-results"></div>
</div>
<div class="test-section">
<h3>📋 Complete System Test</h3>
<button class="test-button" onclick="runCompleteTest()">Run All Tests</button>
<div class="console-output" id="complete-results"></div>
</div>
<script>
        let voiceRecognition = null;
        let isVoiceListening = false;

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const statusClass = type === 'pass' ? 'status-pass' : type === 'fail' ? 'status-fail' : 'status-info';
            element.innerHTML += `<div class="status ${statusClass}">[${timestamp}] ${message}</div>`;
            element.scrollTop = element.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }

        function testBrowserFeatures() {
            const results = document.getElementById('browser-results');
            results.innerHTML = '';

            log('browser-results', '=== Browser Feature Test ===', 'info');

            // Test speech recognition
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                log('browser-results', '✅ Speech Recognition API available', 'pass');
            } else {
                log('browser-results', '❌ Speech Recognition API not available', 'fail');
            }

            // Test speech synthesis
            if ('speechSynthesis' in window) {
                log('browser-results', '✅ Speech Synthesis API available', 'pass');
            } else {
                log('browser-results', '❌ Speech Synthesis API not available', 'fail');
            }

            // Test local storage
            if (typeof Storage !== 'undefined') {
                log('browser-results', '✅ Local Storage available', 'pass');
            } else {
                log('browser-results', '❌ Local Storage not available', 'fail');
            }

            // Test HTTPS (required for voice)
            if (window.location.protocol === 'https:') {
                log('browser-results', '✅ HTTPS connection detected', 'pass');
            } else {
                log('browser-results', '⚠️ HTTP connection - voice may not work', 'info');
            }

            // Test browser type
            const userAgent = navigator.userAgent;
            if (userAgent.includes('Chrome')) {
                log('browser-results', '✅ Chrome detected - best compatibility', 'pass');
            } else if (userAgent.includes('Firefox')) {
                log('browser-results', '⚠️ Firefox detected - limited voice support', 'info');
            } else if (userAgent.includes('Safari')) {
                log('browser-results', '⚠️ Safari detected - voice support varies', 'info');
            } else {
                log('browser-results', '❓ Unknown browser - compatibility uncertain', 'info');
            }
        }

        function testEventListeners() {
            const results = document.getElementById('event-results');
            results.innerHTML = '';

            log('event-results', '=== Event Listener Test ===', 'info');

            try {
                // Test basic click event
                const testClick = document.createElement('button');
                testClick.textContent = 'Test Click';
                let clickFired = false;
                
                testClick.addEventListener('click', () => {
                    clickFired = true;
                    log('event-results', '✅ Click event fired successfully', 'pass');
                });

                // Simulate click
                testClick.click();
                
                if (clickFired) {
                    log('event-results', '✅ Event listener attachment working', 'pass');
                } else {
                    log('event-results', '❌ Event listener not firing', 'fail');
                }

                // Test multiple event types
                let eventsTested = 0;
                let eventsPassed = 0;

                const eventTypes = ['click', 'mousedown', 'mouseup', 'keydown', 'keyup'];
                
                eventTypes.forEach(eventType => {
                    eventsTested++;
                    const element = document.createElement('button');
                    let eventFired = false;
                    
                    element.addEventListener(eventType, () => {
                        eventFired = true;
                    });

                    // Dispatch event
                    const event = new Event(eventType);
                    element.dispatchEvent(event);

                    if (eventFired) {
                        eventsPassed++;
                        log('event-results', `✅ ${eventType} event working`, 'pass');
                    } else {
                        log('event-results', `❌ ${eventType} event not working`, 'fail');
                    }
                });

                log('event-results', `Event test summary: ${eventsPassed}/${eventsTested} events working`, 
                    eventsPassed === eventsTested ? 'pass' : 'fail');

            } catch (error) {
                log('event-results', `❌ Event listener test error: ${error.message}`, 'fail');
            }
        }

        function testVoiceRecognition() {
            const results = document.getElementById('voice-results');
            results.innerHTML = '';

            log('voice-results', '=== Voice Recognition Test ===', 'info');

            try {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    log('voice-results', '❌ Speech Recognition not supported', 'fail');
                    return;
                }

                if (voiceRecognition) {
                    voiceRecognition.stop();
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                voiceRecognition = new SpeechRecognition();
                
                voiceRecognition.continuous = true;
                voiceRecognition.interimResults = true;
                voiceRecognition.lang = 'en-US';

                voiceRecognition.onstart = () => {
                    isVoiceListening = true;
                    log('voice-results', '✅ Voice recognition started', 'pass');
                };

                voiceRecognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    
                    if (finalTranscript) {
                        log('voice-results', `✅ Voice recognized: "${finalTranscript}"`, 'pass');
                        
                        if (finalTranscript.toLowerCase().includes('hey henry')) {
                            log('voice-results', '🎉 "Hey Henry" wake word detected!', 'pass');
                        }
                    }
                };

                voiceRecognition.onerror = (event) => {
                    log('voice-results', `❌ Voice recognition error: ${event.error}`, 'fail');
                };

                voiceRecognition.onend = () => {
                    isVoiceListening = false;
                    log('voice-results', 'Voice recognition ended', 'info');
                };

                voiceRecognition.start();
                log('voice-results', 'Voice recognition test started - say something...', 'info');

            } catch (error) {
                log('voice-results', `❌ Voice recognition test error: ${error.message}`, 'fail');
            }
        }

        function stopVoiceTest() {
            if (voiceRecognition && isVoiceListening) {
                voiceRecognition.stop();
                log('voice-results', 'Voice recognition stopped by user', 'info');
            }
        }

        function testJavaScriptErrors() {
            const results = document.getElementById('error-results');
            results.innerHTML = '';

            log('error-results', '=== JavaScript Error Handling Test ===', 'info');

            try {
                // Test undefined function call
                try {
                    undefinedFunction();
                } catch (error) {
                    log('error-results', `✅ Caught undefined function error: ${error.message}`, 'pass');
                }

                // Test type error
                try {
                    null.someMethod();
                } catch (error) {
                    log('error-results', `✅ Caught type error: ${error.message}`, 'pass');
                }

                // Test syntax error simulation
                try {
                    eval('invalid javascript syntax');
                } catch (error) {
                    log('error-results', `✅ Caught syntax error: ${error.message}`, 'pass');
                }

                log('error-results', '✅ Error handling system working correctly', 'pass');

            } catch (error) {
                log('error-results', `❌ Error handling test failed: ${error.message}`, 'fail');
            }
        }

        function runCompleteTest() {
            const results = document.getElementById('complete-results');
            results.innerHTML = '';

            log('complete-results', '=== COMPLETE SYSTEM TEST ===', 'info');
            log('complete-results', 'Starting comprehensive diagnostic...', 'info');

            // Run all tests
            testBrowserFeatures();
            testEventListeners();
            testJavaScriptErrors();

            // Test keyboard events
            const testInput = document.getElementById('test-input');
            testInput.addEventListener('keypress', (e) => {
                log('complete-results', `Keyboard event: ${e.key} pressed`, 'info');
                if (e.key === 'Enter') {
                    log('complete-results', '✅ Enter key detection working', 'pass');
                    e.preventDefault();
                }
            });

            // Test button clicks
            for (let i = 1; i <= 3; i++) {
                const button = document.getElementById(`test-button-${i}`);
                button.addEventListener('click', () => {
                    log('complete-results', `✅ Button ${i} click detected`, 'pass');
                });
            }

            log('complete-results', 'Complete system test finished - check individual sections for detailed results', 'info');
        }

        // Initialize keyboard event testing
        document.addEventListener('DOMContentLoaded', () => {
            const testInput = document.getElementById('test-input');
            const keyboardResults = document.getElementById('keyboard-results');
            
            testInput.addEventListener('keydown', (e) => {
                log('keyboard-results', `Keydown: ${e.key} (code: ${e.code})`, 'info');
            });
            
            testInput.addEventListener('keypress', (e) => {
                log('keyboard-results', `Keypress: ${e.key} (code: ${e.code})`, 'info');
                if (e.key === 'Enter') {
                    log('keyboard-results', '✅ Enter key detected!', 'pass');
                    e.preventDefault();
                }
            });
            
            testInput.addEventListener('keyup', (e) => {
                log('keyboard-results', `Keyup: ${e.key} (code: ${e.code})`, 'info');
            });

            log('keyboard-results', 'Keyboard event testing ready - type in the input field...', 'info');
        });
    </script>
<script src="henry-core.js"></script></body>
</html>
